<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр Albumentations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F7F8F5; --surface:#FFFFFF; --ink:#16202A; --muted:#5A6572; --line:#D5DAD6;
  --accent:#2346D8; --accent-ink:#FFFFFF; --accent-soft:#E0E6FC;
  --ok:#1C7A50; --ok-soft:#D8EFE3; --bad:#B3302A; --bad-soft:#F7DDDA;
  --frame:#E6E9EC; --code-bg:#17202B; --code-ink:#DCE3EA; --code-kw:#93A9FF; --code-str:#E8C66F; --code-num:#F2A27A;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --paper:#121920; --surface:#19222C; --ink:#E5EAEF; --muted:#98A3AF; --line:#2A3541;
    --accent:#8299FF; --accent-ink:#0A0E13; --accent-soft:#1E2850;
    --ok:#47BA86; --ok-soft:#133528; --bad:#EF7266; --bad-soft:#42201C; --frame:#0F151B; --code-bg:#0C1117;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#121920; --surface:#19222C; --ink:#E5EAEF; --muted:#98A3AF; --line:#2A3541;
  --accent:#8299FF; --accent-ink:#0A0E13; --accent-soft:#1E2850;
  --ok:#47BA86; --ok-soft:#133528; --bad:#EF7266; --bad-soft:#42201C; --frame:#0F151B; --code-bg:#0C1117;}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:920px;margin:0 auto;padding-inline:18px;padding-block:36px 90px;display:flex;flex-direction:column;gap:30px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,4.6vw,40px);line-height:1.1}
h2{font-size:clamp(19px,2.6vw,23px);line-height:1.2}
p{margin:0}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.eyebrow::before{content:"";width:11px;height:11px;flex:none;background:conic-gradient(var(--accent) 0 25%,transparent 0 50%,var(--accent) 0 75%,transparent 0)}
.muted{color:var(--muted)}
code{font-family:var(--mono);font-size:.88em;background:var(--accent-soft);padding:.05em .35em;border-radius:4px}

.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:24px;align-items:center}
@media (max-width:640px){.intro{grid-template-columns:minmax(0,1fr)}}

.status{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar{flex:1;min-width:140px;height:6px;border-radius:6px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .r{background:var(--ok)} .bar .w{background:var(--bad)}
.nums{font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.nums b{color:var(--ink)}

.part{display:flex;flex-direction:column;gap:14px}
.part > header{display:flex;flex-direction:column;gap:4px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.q.right{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.q.wrong{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.meta{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qt{font-size:17px;font-weight:500}

.frame{aspect-ratio:4/3;background:var(--frame);border-radius:8px;display:grid;place-items:center;overflow:hidden;min-width:0}
.frame canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto}
fig{display:flex;flex-direction:column;gap:6px;min-width:0}
.cap{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);gap:10px;align-items:center;max-width:620px}
.arrow{font-family:var(--display);color:var(--muted);text-align:center;font-size:22px}

.opts{display:grid;gap:8px}
.opts.img{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.opts.img{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;font-size:15px}
.opt.img{flex-direction:column;align-items:stretch;padding:8px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .l{font-family:var(--mono);font-size:13px;color:var(--muted);flex:none}
.opt .c{font-family:var(--mono);font-size:13.5px;overflow-wrap:anywhere}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.picked.incorrect{border-color:var(--bad);background:var(--bad-soft)}
.why{font-size:14.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.why b{color:var(--ink)}

pre,.codebox{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.6}
pre,pre *,.codebox,.codebox *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.kw{color:var(--code-kw)} .st{color:var(--code-str)} .nu{color:var(--code-num)}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--code-str);text-align:center;color:var(--code-str)}

/* builder */
.build{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;max-width:640px}
.palette{display:flex;flex-wrap:wrap;gap:8px}
.blk{font-family:var(--mono);font-size:13px;padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:var(--paper);cursor:pointer;text-align:left}
.blk:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.blk:disabled{opacity:.5;cursor:default}
.codebox .ln{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-left:2em}
.codebox .ln button{background:none;border:0;color:var(--code-ink);opacity:.6;cursor:pointer;font-size:14px;padding:0 4px}
.codebox .ln button:hover{opacity:1;color:#EF7266}
.codebox .empty{padding-left:2em;opacity:.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){color:var(--accent-ink);filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.fb{font-size:14.5px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}

.result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.big{font-family:var(--display);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
.trow{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr) 60px;gap:12px;align-items:center;font-size:14.5px}
.trow .tb{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.trow .tb i{display:block;height:100%;background:var(--accent)}
.trow span:last-child{font-family:var(--mono);font-size:13px;text-align:right;color:var(--muted)}
@media (max-width:520px){.trow{grid-template-columns:minmax(0,1fr) 54px}.trow .tb{grid-column:1 / -1;grid-row:2}}
</style>
<style>html,body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap" lang="ru">
  <header class="intro">
    <div style="display:flex;flex-direction:column;gap:14px">
      <p class="eyebrow">Аугментация · практика кода</p>
      <h1>Тренажёр Albumentations</h1>
      <p class="muted">Все задания работают с одной картинкой размером 480 × 360 (справа). Считаем, что уже написано <code>import albumentations as A</code>, а картинка лежит в массиве <code>img</code>. У всех блоков <code>p=1</code>, то есть они срабатывают всегда.</p>
      <div class="row"><button class="btn" id="reset">Начать заново</button></div>
    </div>
    <fig><div class="frame" id="baseFrame"></div><span class="cap">img · 480 × 360</span></fig>
  </header>

  <div class="status" aria-live="polite">
    <div class="bar"><i class="r" id="barR"></i><i class="w" id="barW"></i></div>
    <span class="nums" id="nums"></span>
  </div>

  <div id="parts"></div>

  <section class="result">
    <h2>Результат</h2>
    <div class="big" id="big"></div>
    <p class="muted" id="verdict"></p>
    <div style="display:grid;gap:8px" id="byPart"></div>
  </section>
</div>

<script>
(function(){
/* ================= блоки Albumentations ================= */
const B={
  hflip:    {code:'A.HorizontalFlip(p=1)'},
  vflip:    {code:'A.VerticalFlip(p=1)'},
  transpose:{code:'A.Transpose(p=1)'},
  rot180:   {code:'A.Rotate(limit=(180, 180), p=1)'},
  gray:     {code:'A.ToGray(p=1)'},
  invert:   {code:'A.InvertImg(p=1)'},
  sepia:    {code:'A.ToSepia(p=1)'},
  bright:   {code:'A.RandomBrightnessContrast(brightness_limit=(0.3, 0.3), contrast_limit=(0, 0), p=1)'},
  blur:     {code:'A.GaussianBlur(blur_limit=(15, 15), p=1)'},
  zoomIn:   {code:'A.Affine(scale=1.4, p=1)'},
  zoomOut:  {code:'A.Affine(scale=0.7, p=1)'},
  shiftR:   {code:'A.Affine(translate_px={"x": 100, "y": 0}, p=1)'},
  shiftD:   {code:'A.Affine(translate_px={"x": 0, "y": 80}, p=1)'},
  crop:     {code:'A.Crop(x_min=0, y_min=0, x_max=300, y_max=240, p=1)'},
  center:   {code:'A.CenterCrop(height=240, width=240, p=1)'}
};

/* ================= задания =================
   pick:  какой блок даёт «Стало»     — ops: цель, opts: ключи блоков (первый верный)
   what:  что получится после кода    — opts: массивы блоков (первый верный)
   build: соберите пайплайн           — ops: цель, palette: доступные блоки
   fill:  заполните пропуск           — code с ___, opts: строки (первый верный)      */
const PARTS=[
 {title:'Какой блок нужен?',sub:'Посмотрите на «Было» и «Стало» и выберите одно преобразование.',qs:[
  {t:'pick',ops:['vflip'],opts:['vflip','hflip','rot180','transpose'],why:'Небо внизу, трава сверху, но надпись ML не отражена слева направо. Это отражение сверху вниз.'},
  {t:'pick',ops:['hflip'],opts:['hflip','vflip','transpose','rot180'],why:'Верх и низ на месте, а ручка чашки и надпись ML поменяли сторону. Это отражение слева направо.'},
  {t:'pick',ops:['transpose'],opts:['transpose','rot180','vflip','hflip'],why:'Картинка стала вертикальной: 360 × 480. Transpose меняет местами строки и столбцы, то есть отражает по диагонали.'},
  {t:'pick',ops:['gray'],opts:['gray','sepia','invert','bright'],why:'Цвета пропали, остались оттенки серого. ToSepia дала бы коричневый оттенок, InvertImg — негатив.'},
  {t:'pick',ops:['zoomOut'],opts:['zoomOut','zoomIn','center','shiftD'],why:'Всё уменьшилось, по краям появились чёрные поля, размер кадра прежний. Это Affine со scale меньше 1.'},
  {t:'pick',ops:['shiftR'],opts:['shiftR','shiftD','hflip','zoomIn'],why:'Картинка уехала вправо, слева чёрная полоса. translate_px с положительным x сдвигает вправо.'}
 ]},
 {title:'Что получится?',sub:'Прочитайте код и выберите картинку, которую он вернёт.',qs:[
  {t:'what',ops:['hflip','vflip'],opts:[['hflip','vflip'],['hflip'],['vflip'],['transpose']],why:'Два отражения подряд — это поворот на 180°.'},
  {t:'what',ops:['transpose','hflip'],opts:[['transpose','hflip'],['hflip','transpose'],['transpose'],['rot180']],why:'Transpose, а потом отражение слева направо — это поворот на 90°. В обратном порядке получится поворот в другую сторону: порядок блоков важен!'},
  {t:'what',ops:['crop','gray'],opts:[['crop','gray'],['gray'],['center','gray'],['crop']],why:'Crop вырезает прямоугольник от (0, 0) до (300, 240), а ToGray делает его серым. CenterCrop вырезал бы квадрат из центра.'},
  {t:'what',ops:['invert','invert'],opts:[[],['invert'],['gray'],['vflip']],why:'Негатив негатива — исходная картинка: 255 − (255 − x) = x.'}
 ]},
 {title:'Соберите пайплайн',sub:'Кликайте по блокам, чтобы добавить их в Compose. Ваш результат рисуется сразу. Порядок блоков может иметь значение.',qs:[
  {t:'build',ops:['vflip','gray'],palette:['hflip','vflip','gray','sepia','invert']},
  {t:'build',ops:['hflip','zoomIn'],palette:['hflip','vflip','zoomIn','zoomOut','center']},
  {t:'build',ops:['shiftD','invert'],palette:['shiftR','shiftD','invert','gray','bright']},
  {t:'build',ops:['transpose','vflip'],palette:['transpose','hflip','vflip','rot180','gray']},
  {t:'build',ops:['crop','hflip','blur'],palette:['crop','center','hflip','vflip','blur','bright']},
  {t:'build',ops:['rot180','sepia','bright'],palette:['hflip','vflip','rot180','sepia','gray','bright','invert']}
 ]},
 {title:'Заполните пропуск',sub:'Выберите, что должно стоять на месте пропуска.',qs:[
  {t:'fill',code:'aug = A.Compose([A.HorizontalFlip(p=1)])\nout = aug(image=img)[___]',opts:['"image"','"img"','0','"result"'],why:'Compose возвращает словарь. Картинка лежит по ключу "image" — так же, как называется аргумент.'},
  {t:'fill',code:'from PIL import Image\nimport numpy as np\n\nimg = ___(Image.open("cat.jpg").convert("RGB"))\nout = aug(image=img)["image"]',opts:['np.array','list','Image.fromarray','str'],why:'Albumentations работает с массивами NumPy формы (H, W, 3), а не с объектами Pillow.'},
  {t:'fill',code:'# отражать не всегда, а в половине случаев\nA.HorizontalFlip(p=___)',opts:['0.5','1','50','0'],why:'p — вероятность от 0 до 1. p=0.5 — примерно в половине вызовов, p=1 — всегда, p=0 — никогда.'},
  {t:'fill',code:'# рамки записаны как (x1, y1, x2, y2) в пикселях\nA.Compose([...], bbox_params=A.BboxParams(format=___))',opts:['"pascal_voc"','"yolo"','"coco"','"xyxy"'],why:'pascal_voc — углы в пикселях. coco — (x, y, ширина, высота), yolo — центр и размеры в долях 0…1.'},
  {t:'fill',code:'# при каждом запуске результат должен быть одинаковым\naug = A.Compose([...], ___)',opts:['seed=42','p=42','random=False','fixed=True'],why:'seed фиксирует генератор случайных чисел, и случайные параметры повторяются.'},
  {t:'fill',code:'out = aug(image=img)["image"]\nImage.___(out).save("result.jpg")',opts:['fromarray','open','new','show'],why:'Image.fromarray превращает массив NumPy обратно в картинку Pillow.'}
 ]}
];

/* ================= рисование ================= */
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function makeObject(){
  const c=cv(240,240),g=c.getContext('2d');
  g.fillStyle='#d4d9df';g.beginPath();g.ellipse(112,202,94,17,0,0,Math.PI*2);g.fill();
  g.fillStyle='#b8bec6';g.beginPath();g.ellipse(112,198,62,9,0,0,Math.PI*2);g.fill();
  g.strokeStyle='#d8621a';g.lineWidth=15;g.beginPath();g.ellipse(160,124,32,34,0,-Math.PI/2,Math.PI/2);g.stroke();
  const grd=g.createLinearGradient(52,0,172,0);grd.addColorStop(0,'#f59a3a');grd.addColorStop(.7,'#ef8424');grd.addColorStop(1,'#cf6415');
  g.fillStyle=grd;g.beginPath();g.moveTo(50,72);g.lineTo(174,72);g.lineTo(160,186);g.quadraticCurveTo(112,204,64,186);g.closePath();g.fill();
  g.fillStyle='#b9530f';g.beginPath();g.ellipse(112,72,62,12,0,0,Math.PI*2);g.fill();
  g.fillStyle='#5a2c0c';g.beginPath();g.ellipse(112,74,52,8,0,0,Math.PI*2);g.fill();
  g.fillStyle='#fff';g.font='700 38px Unbounded, "Golos Text", sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('ML',108,132);
  g.strokeStyle='rgba(140,150,160,.9)';g.lineWidth=5;g.lineCap='round';
  for(const x of [88,114,140]){g.beginPath();g.moveTo(x,56);g.bezierCurveTo(x-14,42,x+14,28,x,8);g.stroke()}
  return c;
}
function makeBase(){
  const W=480,H=360,c=cv(W,H),g=c.getContext('2d'),r=rng(990);
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#3f79c9');gr.addColorStop(1,'#cfe3f4');g.fillStyle=gr;g.fillRect(0,0,W,H);
  for(const [cx,cy] of [[70,60],[390,90],[250,40]]){g.fillStyle='rgba(255,255,255,.9)';for(let j=0;j<7;j++){g.beginPath();g.arc(cx+(r()-.5)*100,cy+(r()-.5)*24,16+r()*20,0,7);g.fill()}}
  g.fillStyle='#e0b43a';g.beginPath();g.arc(430,40,22,0,7);g.fill();
  g.fillStyle='#5f7f4a';g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=20)g.lineTo(x,H-70-Math.sin(x/60)*16-r()*6);g.lineTo(W,H);g.fill();
  const s=250;g.drawImage(OBJ,(W-s)/2-10,(H-s)/2+18,s,s);
  return c;
}
function geo(src,w,h,fn,black){const c=cv(w,h),g=c.getContext('2d');if(black){g.fillStyle='#000';g.fillRect(0,0,w,h)}fn(g);g.drawImage(src,0,0);return c}
function pix(src,fn){const c=cv(src.width,src.height),g=c.getContext('2d');g.drawImage(src,0,0);const d=g.getImageData(0,0,c.width,c.height),a=d.data;
  for(let i=0;i<a.length;i+=4){const o=fn(a[i],a[i+1],a[i+2]);a[i]=o[0];a[i+1]=o[1];a[i+2]=o[2]}g.putImageData(d,0,0);return c}
const cl=v=>v<0?0:v>255?255:v;
const OPS={
  hflip:s=>geo(s,s.width,s.height,g=>{g.translate(s.width,0);g.scale(-1,1)}),
  vflip:s=>geo(s,s.width,s.height,g=>{g.translate(0,s.height);g.scale(1,-1)}),
  rot180:s=>geo(s,s.width,s.height,g=>{g.translate(s.width,s.height);g.scale(-1,-1)}),
  transpose:s=>geo(s,s.height,s.width,g=>g.setTransform(0,1,1,0,0,0)),
  zoomIn:s=>geo(s,s.width,s.height,g=>{g.translate(s.width/2,s.height/2);g.scale(1.4,1.4);g.translate(-s.width/2,-s.height/2)},true),
  zoomOut:s=>geo(s,s.width,s.height,g=>{g.translate(s.width/2,s.height/2);g.scale(.7,.7);g.translate(-s.width/2,-s.height/2)},true),
  shiftR:s=>geo(s,s.width,s.height,g=>g.translate(100,0),true),
  shiftD:s=>geo(s,s.width,s.height,g=>g.translate(0,80),true),
  crop:s=>{const c=cv(300,240);c.getContext('2d').drawImage(s,0,0,300,240,0,0,300,240);return c},
  center:s=>{const c=cv(240,240),x=(s.width-240)/2,y=(s.height-240)/2;c.getContext('2d').drawImage(s,x,y,240,240,0,0,240,240);return c},
  gray:s=>pix(s,(r,g,b)=>{const y=.299*r+.587*g+.114*b;return[y,y,y]}),
  invert:s=>pix(s,(r,g,b)=>[255-r,255-g,255-b]),
  sepia:s=>pix(s,(r,g,b)=>[cl(.393*r+.769*g+.189*b),cl(.349*r+.686*g+.168*b),cl(.272*r+.534*g+.131*b)]),
  bright:s=>pix(s,(r,g,b)=>[cl(r+76),cl(g+76),cl(b+76)]),
  blur:s=>{const k=6,sm=cv(Math.max(1,s.width/k|0),Math.max(1,s.height/k|0)),g1=sm.getContext('2d');g1.imageSmoothingQuality='high';g1.drawImage(s,0,0,sm.width,sm.height);
    const c=cv(s.width,s.height),g2=c.getContext('2d');g2.imageSmoothingQuality='high';g2.drawImage(sm,0,0,c.width,c.height);return c}
};
let OBJ,BASE;const cache={};
function render(ops){const key=ops.join('|');if(cache[key])return cache[key];let c=BASE;for(const o of ops)c=OPS[o](c);return cache[key]=c}
function show(ops,frame,capEl){
  const src=render(ops),c=cv(src.width,src.height);c.getContext('2d').drawImage(src,0,0);
  c.setAttribute('role','img');c.setAttribute('aria-label','картинка '+src.width+' × '+src.height);
  frame.innerHTML='';frame.appendChild(c);if(capEl)capEl.textContent=src.width+' × '+src.height;
}
function same(a,b){
  const A1=render(a),B1=render(b);if(A1.width!==B1.width||A1.height!==B1.height)return false;
  const da=A1.getContext('2d').getImageData(0,0,A1.width,A1.height).data,db=B1.getContext('2d').getImageData(0,0,B1.width,B1.height).data;
  let s=0,n=0;for(let i=0;i<da.length;i+=4*7){s+=Math.abs(da[i]-db[i])+Math.abs(da[i+1]-db[i+1])+Math.abs(da[i+2]-db[i+2]);n+=3}
  return s/n<6;
}

/* ================= подсветка кода ================= */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function hl(s){
  return esc(s).split('\n').map(line=>{
    const h=line.indexOf('#'), code=h<0?line:line.slice(0,h), com=h<0?'':line.slice(h);
    const c=code.replace(/"([^"]*)"|\b(import|from|as)\b|\b(\d+(?:\.\d+)?)\b|___/g,(m,str,kw,num)=>
      str!=null?'<span class="st">"'+str+'"</span>':kw?'<span class="kw">'+kw+'</span>':num?'<span class="nu">'+num+'</span>':'<span class="blank">?</span>');
    return c+(com?'<span class="muted">'+com+'</span>':'');
  }).join('\n');
}
const composeCode=ops=>'aug = A.Compose([\n'+ops.map(o=>'    '+B[o].code+',').join('\n')+(ops.length?'\n':'')+'])\nout = aug(image=img)["image"]';

/* ================= сборка страницы ================= */
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const L='АБВГ';
let state; // state[qid] = {done, ok}
const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};

function build(){
  state={};const root=$('parts');root.innerHTML='';let num=0,total=PARTS.reduce((s,p)=>s+p.qs.length,0);
  PARTS.forEach((part,pi)=>{
    const sec=el('section','part');
    sec.appendChild(el('header',null,`<p class="eyebrow">Часть ${pi+1} из ${PARTS.length}</p><h2>${part.title}</h2><p class="muted">${part.sub}</p>`));
    part.qs.forEach((q,qi)=>{num++;const id=pi+'-'+qi;q.part=pi;
      const card=el('article','q');card.appendChild(el('div','meta',`<span>Задание ${num} из ${total}</span><span>${part.title}</span>`));
      ({pick:mkPick,what:mkWhat,build:mkBuild,fill:mkFill})[q.t](card,q,id);
      sec.appendChild(card);
    });
    root.appendChild(sec);
  });
  update();
}
function finish(card,id,ok,whyHtml){
  state[id]={done:true,ok};card.classList.add(ok?'right':'wrong');
  if(whyHtml!=null){card.appendChild(el('p','why',(ok?'<b>Верно.</b> ':'<b>Неверно.</b> ')+whyHtml))}
  update();
}
function choiceButtons(card,id,items,render1,why,cls){
  const box=el('div','opts'+(cls?' '+cls:''));
  const order=shuf(items.map((_,i)=>i));
  order.forEach((oi,pos)=>{
    const b=el('button','opt'+(cls?' '+cls:''));b.type='button';render1(b,items[oi],pos);
    b.onclick=()=>{box.querySelectorAll('button').forEach((x,k)=>{x.disabled=true;if(order[k]===0)x.classList.add('correct')});
      b.classList.add('picked');if(oi!==0)b.classList.add('incorrect');finish(card,id,oi===0,why)};
    box.appendChild(b);
  });
  card.appendChild(box);
}
function pairFig(card,ops,label2){
  const p=el('div','pair');
  const f1=el('fig'),fr1=el('div','frame'),c1=el('span','cap');f1.append(fr1,c1);
  const f2=el('fig'),fr2=el('div','frame'),c2=el('span','cap');f2.append(fr2,c2);
  p.append(f1,el('div','arrow','→'),f2);card.appendChild(p);
  show([],fr1);c1.textContent='было · 480 × 360';show(ops,fr2,c2);c2.textContent=label2+' · '+c2.textContent;
}
function mkPick(card,q,id){
  card.appendChild(el('p','qt','Какой блок превращает «Было» в «Стало»?'));
  pairFig(card,q.ops,'стало');
  choiceButtons(card,id,q.opts,(b,k,pos)=>{b.innerHTML=`<span class="l">${L[pos]}</span><span class="c">${esc(B[k].code)}</span>`},q.why);
}
function mkWhat(card,q,id){
  card.appendChild(el('p','qt','Какую картинку вернёт этот код?'));
  card.appendChild(el('pre',null,hl(composeCode(q.ops))));
  choiceButtons(card,id,q.opts,(b,ops,pos)=>{const fr=el('div','frame');show(ops,fr);b.append(fr,el('span','cap',L[pos]))},q.why,'img');
}
function mkFill(card,q,id){
  card.appendChild(el('p','qt','Что должно стоять на месте пропуска?'));
  card.appendChild(el('pre',null,hl(q.code)));
  choiceButtons(card,id,q.opts,(b,s,pos)=>{b.innerHTML=`<span class="l">${L[pos]}</span><span class="c">${esc(s)}</span>`},q.why);
}
function mkBuild(card,q,id){
  card.appendChild(el('p','qt','Соберите пайплайн, который из <code>img</code> делает «Цель».'));
  const wrap=el('div','build');
  const f1=el('fig'),fr1=el('div','frame'),c1=el('span','cap');f1.append(fr1,c1);
  const f2=el('fig'),fr2=el('div','frame'),c2=el('span','cap');f2.append(fr2,c2);
  wrap.append(f1,f2);card.appendChild(wrap);
  show(q.ops,fr1,c1);c1.textContent='цель · '+c1.textContent;
  let cur=[],tries=0,locked=false;
  const pal=el('div','palette');
  shuf(q.palette).forEach(k=>{const b=el('button','blk');b.type='button';b.textContent=B[k].code;b.onclick=()=>{if(locked)return;cur.push(k);redraw()};pal.appendChild(b)});
  const box=el('div','codebox');
  const fb=el('p','fb');
  const bCheck=el('button','btn primary','Проверить'),bClear=el('button','btn','Очистить'),bGive=el('button','btn','Показать ответ');
  [bCheck,bClear,bGive].forEach(b=>b.type='button');
  const row=el('div','row');row.append(bCheck,bClear,bGive,fb);
  card.appendChild(el('p','muted','Блоки (клик — добавить в конец):'));card.append(pal,box,row);
  function redraw(){
    box.innerHTML='<div><span class="kw">aug</span> = A.Compose([</div>';
    if(!cur.length)box.appendChild(el('div','empty','# добавьте блоки'));
    cur.forEach((k,i)=>{const ln=el('div','ln');const s=el('span',null,hl(B[k].code)+',');ln.appendChild(s);
      if(!locked){const x=el('button',null,'✕');x.type='button';x.title='Убрать блок';x.setAttribute('aria-label','Убрать '+B[k].code);x.onclick=()=>{cur.splice(i,1);redraw()};ln.appendChild(x)}
      box.appendChild(ln)});
    box.appendChild(el('div',null,'])'));
    show(cur,fr2,c2);c2.textContent='ваш результат · '+c2.textContent;
  }
  bClear.onclick=()=>{if(!locked){cur=[];fb.textContent='';redraw()}};
  bCheck.onclick=()=>{
    if(locked)return;tries++;
    if(same(cur,q.ops)){locked=true;fb.className='fb ok';fb.textContent=tries===1?'Совпало с первой попытки!':`Совпало. Попыток: ${tries}.`;
      [bCheck,bClear,bGive].forEach(b=>b.disabled=true);pal.querySelectorAll('button').forEach(b=>b.disabled=true);redraw();finish(card,id,true,null)}
    else{fb.className='fb bad';
      const A1=render(cur),T=render(q.ops);
      fb.textContent=(A1.width!==T.width||A1.height!==T.height)?`Размер не совпадает: у вас ${A1.width} × ${A1.height}, нужно ${T.width} × ${T.height}.`:'Пока не совпадает. Сравните картинки и проверьте порядок блоков.'}
  };
  bGive.onclick=()=>{
    if(locked)return;locked=true;cur=q.ops.slice();[bCheck,bClear,bGive].forEach(b=>b.disabled=true);pal.querySelectorAll('button').forEach(b=>b.disabled=true);
    redraw();fb.className='fb bad';fb.textContent='Правильный пайплайн показан выше.';finish(card,id,false,null);
  };
  redraw();
}
function update(){
  const all=[];PARTS.forEach((p,pi)=>p.qs.forEach((q,qi)=>all.push({pi,id:pi+'-'+qi})));
  const n=all.length,done=all.filter(x=>state[x.id]),right=done.filter(x=>state[x.id].ok).length;
  $('barR').style.width=(right/n*100)+'%';$('barW').style.width=((done.length-right)/n*100)+'%';
  $('nums').innerHTML=`выполнено <b>${done.length}</b> из ${n} · верно <b>${right}</b>`;
  $('big').textContent=`${right} / ${n}`;
  const pct=right/n;
  $('verdict').textContent=done.length<n?`Выполнено ${done.length} из ${n}. Доделайте все задания, чтобы увидеть итог.`
    :pct>=.85?'Отлично: вы уверенно собираете пайплайны Albumentations.':pct>=.6?'Хорошо. Посмотрите объяснения к ошибкам и попробуйте ещё раз.':'Стоит повторить слайды про Albumentations и пройти тренажёр заново.';
  const bp=$('byPart');bp.innerHTML='';
  PARTS.forEach((p,pi)=>{const ids=all.filter(x=>x.pi===pi),r=ids.filter(x=>state[x.id]&&state[x.id].ok).length;
    const row=el('div','trow',`<span>${p.title}</span><div class="tb"><i style="width:${r/ids.length*100}%"></i></div><span>${r} / ${ids.length}</span>`);bp.appendChild(row)});
}

/* код не копируется */
const inCode=x=>x&&(x.nodeType===1?x:x.parentElement)?.closest?.('pre,.codebox,.opt .c,.blk');
['copy','cut'].forEach(ev=>document.addEventListener(ev,e=>{const s=getSelection();if(s&&(inCode(s.anchorNode)||inCode(s.focusNode)))e.preventDefault()}));
['contextmenu','selectstart','dragstart'].forEach(ev=>document.addEventListener(ev,e=>{if(inCode(e.target))e.preventDefault()}));

function start(){OBJ=makeObject();BASE=makeBase();show([],$('baseFrame'));build();$('reset').onclick=()=>{build();scrollTo({top:0})}}
const fr=(document.fonts&&document.fonts.load)?document.fonts.load('700 38px Unbounded').catch(()=>{}):Promise.resolve();
Promise.race([fr,new Promise(r=>setTimeout(r,1500))]).then(start);
})();
</script>
