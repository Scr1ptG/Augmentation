<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аугментация</title>
<style>
:root{--bg:#F7F8F5;--ink:#16202A;--muted:#5A6572;--line:#D5DAD6;--accent:#2346D8;--card:#fff}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--bg:#121920;--ink:#E5EAEF;--muted:#98A3AF;--line:#2A3541;--accent:#8299FF;--card:#19222C}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:48px 20px;display:grid;gap:16px}
h1{font-size:28px;margin:0 0 8px}
a{display:block;padding:18px 20px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-decoration:none}
a:hover{border-color:var(--accent)}
a b{display:block;color:var(--accent);font-size:18px}
a span{color:var(--muted);font-size:14.5px}
</style>
</head>
<body>
<main>
  <h1>Аугментация и синтетические данные</h1>
  <a href="lesson/"><b>Презентация</b><span>Синтетика, аугментация, песочница и пошаговая практика</span></a>
  <a href="control/"><b>Контрольная работа</b><span>Индивидуальные варианты, опора и критерии</span></a>
  <a href="quiz/"><b>Тест по курсу ML</b><span>24 вопроса для самопроверки с объяснениями</span></a>
</main>
</body>
</html>
