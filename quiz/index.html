<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Лёгкий тест по ML</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F7F8F5; --surface:#FFFFFF; --ink:#16202A; --muted:#5A6572; --line:#D5DAD6;
  --accent:#2346D8; --accent-ink:#FFFFFF; --accent-soft:#E0E6FC;
  --ok:#1C7A50; --ok-soft:#D8EFE3; --bad:#B3302A; --bad-soft:#F7DDDA;
  --code-bg:#17202B; --code-ink:#DCE3EA;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --paper:#121920; --surface:#19222C; --ink:#E5EAEF; --muted:#98A3AF; --line:#2A3541;
    --accent:#8299FF; --accent-ink:#0A0E13; --accent-soft:#1E2850;
    --ok:#47BA86; --ok-soft:#133528; --bad:#EF7266; --bad-soft:#42201C; --code-bg:#0C1117;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#121920; --surface:#19222C; --ink:#E5EAEF; --muted:#98A3AF; --line:#2A3541;
  --accent:#8299FF; --accent-ink:#0A0E13; --accent-soft:#1E2850;
  --ok:#47BA86; --ok-soft:#133528; --bad:#EF7266; --bad-soft:#42201C; --code-bg:#0C1117;}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-inline:18px;padding-block:36px 90px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,4.6vw,40px);line-height:1.1}
h2{font-size:20px}
p{margin:0}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.eyebrow::before{content:"";width:11px;height:11px;flex:none;background:conic-gradient(var(--accent) 0 25%,transparent 0 50%,var(--accent) 0 75%,transparent 0)}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{font-family:var(--mono);opacity:.75;margin-left:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent)}

.status{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar{flex:1;min-width:140px;height:6px;border-radius:6px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .r{background:var(--ok)} .bar .w{background:var(--bad)}
.nums{font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.nums b{color:var(--ink)}

.list{display:flex;flex-direction:column;gap:14px;counter-reset:q}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.q.right{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.q.wrong{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.q .meta{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.q .text{font-size:17px;font-weight:500;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;font-size:15.5px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .l{font-family:var(--mono);font-size:13px;color:var(--muted);flex:none;width:18px;padding-top:1px}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.picked.incorrect{border-color:var(--bad);background:var(--bad-soft)}
.opt code,.text code,.why code{font-family:var(--mono);font-size:.88em;background:var(--accent-soft);padding:.05em .35em;border-radius:4px}
.why{font-size:14.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.why b{color:var(--ink)}
pre{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55}
pre,pre *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.result{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.big{font-family:var(--display);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
.topics{display:grid;gap:8px}
.trow{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr) 60px;gap:12px;align-items:center;font-size:14.5px}
.trow .tb{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.trow .tb i{display:block;height:100%;background:var(--accent)}
.trow span:last-child{font-family:var(--mono);font-size:13px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:520px){.trow{grid-template-columns:minmax(0,1fr) 54px}.trow .tb{grid-column:1 / -1;grid-row:2}}
</style>
<style>html,body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap" lang="ru">
  <header style="display:flex;flex-direction:column;gap:14px">
    <p class="eyebrow">Machine Learning · самопроверка</p>
    <h1>Лёгкий тест по курсу ML</h1>
    <p class="muted" style="max-width:60ch">Выберите ответ, и сразу появится объяснение. Можно пройти всё подряд или отфильтровать одну тему. Итог по темам — внизу страницы.</p>
  </header>

  <section style="display:flex;flex-direction:column;gap:12px">
    <div class="chips" id="chips" role="group" aria-label="Темы"></div>
    <div class="chips"><button class="btn" id="shuffle">Перемешать вопросы</button><button class="btn" id="reset">Начать заново</button></div>
  </section>

  <div class="status" aria-live="polite">
    <div class="bar"><i class="r" id="barR"></i><i class="w" id="barW"></i></div>
    <span class="nums" id="nums"></span>
  </div>

  <div class="list" id="list"></div>

  <section class="result" id="result" aria-labelledby="rh">
    <h2 id="rh">Результат</h2>
    <div class="big" id="big"></div>
    <p class="muted" id="verdict"></p>
    <div class="topics" id="topics"></div>
  </section>
</div>

<script>
(function(){
/* Каждый вопрос: [тема, текст, код|null, [варианты — ПЕРВЫЙ верный], объяснение] */
const Q=[
 ['Основы ML','Что такое машинное обучение?',null,['Способ научить программу находить закономерности по примерам','Ручное написание правил для каждого случая','Сборка компьютера для игр','Программа для рисования графиков'],'Модель сама находит закономерности в данных, а не выполняет правила, написанные человеком.'],
 ['Основы ML','Какая из задач — классификация?',null,['Определить, кошка или собака на фото','Предсказать температуру завтра','Предсказать цену квартиры','Посчитать среднее в таблице'],'Классификация выбирает один из классов. Температура и цена — это числа, то есть регрессия.'],
 ['Основы ML','Обучение «с учителем» значит, что…',null,['у каждого примера есть правильный ответ (метка)','рядом с компьютером сидит преподаватель','модель учится без данных','данные размечает сама модель'],'Модель видит пары «пример → правильный ответ» и учится их связывать.'],
 ['Основы ML','Что такое признаки (features)?',null,['Входные данные, по которым модель делает прогноз','Правильные ответы','Ошибки модели','Названия файлов'],'Например, для квартиры признаки — площадь, этаж, район, а ответ — цена.'],

 ['Данные','Зачем данные делят на обучающую и тестовую выборки?',null,['Чтобы проверить модель на данных, которых она не видела','Чтобы данные занимали меньше места','Чтобы обучение шло быстрее','Так просто принято, смысла нет'],'Проверка на тех же данных, на которых модель училась, покажет завышенный результат.'],
 ['Данные','В таблице есть пустые ячейки. Что с ними обычно делают?',null,['Заполняют (например, медианой) или удаляют строки','Ничего, модель сама разберётся','Удаляют всю таблицу','Заменяют на слово «пусто»'],'Большинство моделей не умеют работать с пропусками, поэтому их заполняют или убирают.'],
 ['Данные','Какая библиотека Python чаще всего используется для работы с таблицами?',null,['pandas','Pillow','matplotlib','requests'],'pandas работает с таблицами (DataFrame). Pillow — для картинок, matplotlib — для графиков.'],

 ['Обучение','Модель отлично работает на обучающих данных и плохо на новых. Как это называется?',null,['Переобучение','Недообучение','Нормализация','Аугментация'],'Модель «зазубрила» обучающие примеры вместо того, чтобы понять закономерность.'],
 ['Обучение','Что помогает бороться с переобучением?',null,['Больше данных, в том числе аугментация','Проверять модель только на обучающих данных','Удалить тестовую выборку','Уменьшить количество данных'],'Чем разнообразнее данные, тем сложнее модели их просто запомнить.'],
 ['Обучение','Что такое эпоха при обучении нейросети?',null,['Один полный проход по всем обучающим данным','Одна картинка','Один час обучения','Одна ошибка модели'],'За много эпох модель много раз видит одни и те же данные и постепенно улучшается.'],

 ['Метрики','Accuracy (точность) — это…',null,['доля правильных ответов модели','время работы модели','размер модели в мегабайтах','количество эпох'],'Если модель верно ответила на 90 примерах из 100, accuracy = 90 %.'],
 ['Метрики','Модель верно ответила на 45 примерах из 50. Какая accuracy?',null,['90 %','45 %','50 %','95 %'],'45 / 50 = 0.9, то есть 90 %.'],
 ['Метрики','Что лучше для модели: ошибка (loss) уменьшается или растёт во время обучения?',null,['Уменьшается','Растёт','Не важно','Должна быть всегда равна 1'],'Loss показывает, насколько модель ошибается. Хорошее обучение — loss падает.'],

 ['Нейросети','Из чего состоит нейросеть?',null,['Из слоёв нейронов, связанных весами','Из таблиц Excel','Из картинок','Из файлов JPG'],'Каждый слой преобразует данные и передаёт их дальше. Веса подбираются при обучении.'],
 ['Нейросети','Какой тип нейросети чаще всего используют для изображений?',null,['Свёрточная (CNN)','Таблица решений','Линейная регрессия','Сортировка пузырьком'],'Свёрточные слои находят на картинке края, формы и объекты.'],

 ['Изображения','Какая библиотека используется для открытия картинок в Python?',null,['Pillow (PIL)','pandas','scikit-learn','math'],'<code>Image.open("photo.jpg")</code> — открыть картинку через Pillow.'],
 ['Изображения','Что делает <code>img.resize((400, 300))</code>?',null,['Меняет размер картинки на 400 × 300','Поворачивает картинку','Обрезает картинку','Делает картинку чёрно-белой'],'resize меняет размер. Первое число — ширина, второе — высота.'],
 ['Изображения','Что делает <code>img.crop(...)</code>?',null,['Вырезает часть картинки','Увеличивает яркость','Отражает картинку','Сохраняет файл'],'crop вырезает прямоугольник: левый, верхний, правый и нижний край.'],
 ['Изображения','Цветная картинка RGB состоит из трёх каналов. Каких?',null,['Красный, зелёный, синий','Чёрный, белый, серый','Яркость, контраст, резкость','Ширина, высота, глубина'],'R — red, G — green, B — blue. В RGBA есть ещё канал A — прозрачность.'],

 ['Аугментация','Что такое аугментация данных?',null,['Создание новых примеров изменением существующих: поворот, отражение, сдвиг','Удаление плохих картинок','Покупка новых данных','Сжатие картинок в архив'],'Из одного фото получается много слегка разных, и модели есть на чём учиться.'],
 ['Аугментация','Какая аугментация НЕ подходит для распознавания цифр?',null,['Поворот на 180°: 6 превратится в 9','Небольшой сдвиг','Лёгкое размытие','Изменение яркости'],'После аугментации ответ должен остаться тем же. У перевёрнутой 6 ответ уже другой.'],
 ['Аугментация','Что такое синтетические данные?',null,['Данные, созданные программой, а не снятые в реальности','Данные из интернета','Данные, которые удалили','Данные в формате Excel'],'Например, вырезать объект и вклеить на разные фоны, или отрисовать сцену в 3D.'],
 ['Аугментация','Что делает <code>A.HorizontalFlip(p=1)</code> из Albumentations?',null,['Отражает картинку слева направо','Поворачивает на 90°','Делает картинку меньше','Удаляет картинку'],'HorizontalFlip — отражение по горизонтали. p=1 — применять всегда.'],
 ['Аугментация','Какие данные нужно аугментировать?',null,['Только обучающие','Только тестовые','Никакие','Все, включая тест'],'Тест должен оставаться реальным, иначе проверка будет нечестной.']
];

const TOPICS=[...new Set(Q.map(q=>q[0]))];
let order=Q.map((_,i)=>i), active=null, state={}; // state[i] = {pick, ok}
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const optOrder=Q.map(q=>shuf(q[3].map((_,i)=>i)));
const $=id=>document.getElementById(id);
const L='АБВГ';

function chips(){
  const c=$('chips'); c.innerHTML='';
  const mk=(label,val,n)=>{const b=document.createElement('button');b.className='chip';b.type='button';
    b.setAttribute('aria-pressed',String(active===val));b.innerHTML=label+'<small>'+n+'</small>';
    b.onclick=()=>{active=val;chips();render()};c.appendChild(b)};
  mk('Все темы',null,Q.length);
  TOPICS.forEach(t=>mk(t,t,Q.filter(q=>q[0]===t).length));
}
function render(){
  const list=$('list'); list.innerHTML='';
  const shown=order.filter(i=>!active||Q[i][0]===active);
  shown.forEach((i,k)=>{
    const [topic,text,code,opts,why]=Q[i], st=state[i];
    const card=document.createElement('article'); card.className='q'+(st?(st.ok?' right':' wrong'):'');
    card.innerHTML=`<div class="meta"><span>Вопрос ${k+1} из ${shown.length}</span><span>${topic}</span></div><p class="text">${text}</p>`;
    if(code){const pre=document.createElement('pre');pre.textContent=code;card.appendChild(pre)}
    const box=document.createElement('div'); box.className='opts';
    optOrder[i].forEach((oi,pos)=>{
      const b=document.createElement('button'); b.type='button'; b.className='opt';
      b.innerHTML=`<span class="l">${L[pos]}</span><span>${opts[oi]}</span>`;
      if(st){b.disabled=true; if(oi===0)b.classList.add('correct'); if(oi===st.pick){b.classList.add('picked'); if(oi!==0)b.classList.add('incorrect')}}
      b.onclick=()=>{state[i]={pick:oi,ok:oi===0};save();render();update()};
      box.appendChild(b);
    });
    card.appendChild(box);
    if(st){const w=document.createElement('p');w.className='why';w.innerHTML=(st.ok?'<b>Верно.</b> ':'<b>Неверно.</b> ')+why;card.appendChild(w)}
    list.appendChild(card);
  });
}
function update(){
  const ids=Q.map((_,i)=>i).filter(i=>!active||Q[i][0]===active);
  const done=ids.filter(i=>state[i]), right=done.filter(i=>state[i].ok).length, n=ids.length;
  $('barR').style.width=(right/n*100)+'%'; $('barW').style.width=((done.length-right)/n*100)+'%';
  $('nums').innerHTML=`отвечено <b>${done.length}</b> из ${n} · верно <b>${right}</b>`;
  const all=Object.keys(state).length, allRight=Object.values(state).filter(s=>s.ok).length;
  $('big').textContent=`${allRight} / ${Q.length}`;
  const pct=all?allRight/all:0;
  $('verdict').textContent=all<Q.length?`Отвечено ${all} из ${Q.length}. Ответьте на все вопросы, чтобы увидеть полный итог.`
    :pct>=.85?'Отлично: материал курса усвоен.':pct>=.65?'Хорошо. Повторите темы с низким результатом.':'Стоит вернуться к темам с низким результатом и пройти тест ещё раз.';
  const t=$('topics'); t.innerHTML='';
  TOPICS.forEach(tp=>{
    const qi=Q.map((_,i)=>i).filter(i=>Q[i][0]===tp), r=qi.filter(i=>state[i]&&state[i].ok).length;
    const row=document.createElement('div'); row.className='trow';
    row.innerHTML=`<span>${tp}</span><div class="tb"><i style="width:${r/qi.length*100}%"></i></div><span>${r} / ${qi.length}</span>`;
    t.appendChild(row);
  });
}
function save(){try{localStorage.setItem('mlq-easy',JSON.stringify(state))}catch(e){}}
try{const s=JSON.parse(localStorage.getItem('mlq-easy')||'{}'); if(s&&typeof s==='object') state=s}catch(e){}

$('shuffle').onclick=()=>{order=shuf(order.slice());render()};
$('reset').onclick=()=>{state={};save();optOrder.forEach(o=>shuf(o));render();update();scrollTo({top:0})};

/* код в вопросах не копируется */
const inPre=x=>x&&(x.nodeType===1?x:x.parentElement)?.closest?.('pre');
['copy','cut'].forEach(ev=>document.addEventListener(ev,e=>{const s=getSelection();if(s&&(inPre(s.anchorNode)||inPre(s.focusNode))){e.preventDefault()}}));
['contextmenu','selectstart','dragstart'].forEach(ev=>document.addEventListener(ev,e=>{if(inPre(e.target))e.preventDefault()}));

chips(); render(); update();
})();
</script>

</body>
</html>
